name: Website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      # Synthetic browser identifiers for build validation only. Never deployed.
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: boxie-ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: boxie-ci
      VITE_FIREBASE_APP_ID: '1:123456789:web:ci'
      VITE_BOXIE_MICROSOFT_CLIENT_ID: '00000000-0000-4000-8000-000000000000'
      VITE_BOXIE_PUBLIC_REGISTRATION: 'false'
      VITE_BOXIE_ORGANIZATION_SYNC_V2: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run
